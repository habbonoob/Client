# The web front's static files. The ingress sends /api, /gamedata, /mirror, /game and the server's other paths to the
# hotel server; everything else lands here. Nothing is for search engines (robots.txt and X-Robots-Tag).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # repeated in each location: a location's own add_header replaces the server's
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # hashed build output never changes under its name
    location ~ ^/(client/)?assets/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /client/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /client/index.html;
    }

    # the website is one page; its router handles the path
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
